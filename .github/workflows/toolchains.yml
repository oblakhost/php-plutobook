name: Extension checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.pins.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: pins
        run: |
          versions=$(sed -nE 's|.*/php-([0-9.]+)\.tar\.xz$|\1|p' tools/sources.sha256 | jq -R . | jq -sce 'select(length > 0)')
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  extension:
    needs: releases
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.releases.outputs.versions) }}
        flavor: [nts]
        include:
          - php: ${{ fromJSON(needs.releases.outputs.versions)[0] }}
            flavor: debug
          - php: ${{ fromJSON(needs.releases.outputs.versions)[0] }}
            flavor: ubsan
          - php: ${{ fromJSON(needs.releases.outputs.versions)[0] }}
            flavor: asan
    env:
      PHP_RELEASE: ${{ matrix.php }}
      PHP_FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/stage-ubuntu-deps
      - run: scripts/build-php "$PHP_RELEASE" "$PHP_FLAVOR"
      - run: scripts/verify-php "$PHP_RELEASE" "$PHP_FLAVOR"
      - run: scripts/build-plutobook
      - run: scripts/build-extension "$PHP_RELEASE" "$PHP_FLAVOR"
      - run: scripts/test-extension "$PHP_RELEASE" "$PHP_FLAVOR"
      # Sanitizer overhead would distort the invoice suite's memory budget.
      - run: scripts/test-invoice "$PHP_RELEASE" "$PHP_FLAVOR"
        if: matrix.flavor != 'asan'
      - name: Check native rendering, PHP helpers and unit coverage
        if: matrix.php == fromJSON(needs.releases.outputs.versions)[0] && matrix.flavor == 'nts'
        run: |
          scripts/check-plutobook "$PHP_RELEASE"
          scripts/generate-arginfo
          git diff --exit-code -- ext/plutobook_arginfo.h
          scripts/bootstrap-qa "$PHP_RELEASE"
          scripts/check-php "$PHP_RELEASE"
          scripts/unit-coverage "$PHP_RELEASE"
      - name: Locate the unit coverage report
        id: coverage
        if: matrix.php == fromJSON(needs.releases.outputs.versions)[0] && matrix.flavor == 'nts'
        run: echo "file=$(find artifacts/coverage -name coverage.xml -print -quit)" >> "$GITHUB_OUTPUT"
      - name: Upload unit coverage to Codecov
        if: steps.coverage.outputs.file != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.file }}
          disable_search: true
          flags: unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.php }}-${{ matrix.flavor }}
          path: artifacts/

  release:
    needs: extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    # The publish job signs with the organization's GPG_PRIVATE_KEY and GPG_PASSPHRASE.
    secrets: inherit
