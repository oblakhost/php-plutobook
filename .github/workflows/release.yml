name: Release extension

# Called by toolchains.yml after the extension matrix passes for a push to master.
#   version  A semantic-release dry run reports the next version, or nothing when no
#            release is due or master has moved on.
#   linux    Builds and tests the portable modules and packages as that version.
#   renderer Cross-builds the shared Windows renderer from the pinned graphics sources.
#   windows  Builds and tests one native PIE ZIP for each Windows PHP ABI.
#   publish  semantic-release checks the version again, adds the source archive, signs
#            the rpm files and SHA256SUMS with the release key, tags, uploads, publishes.
on: workflow_call

permissions:
  contents: read

jobs:
  version:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      # semantic-release checks that it could push, even in a dry run.
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      windows: ${{ steps.windows.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - id: next
        run: RELEASE_VERSION_OUTPUT="$GITHUB_OUTPUT" npx --no-install semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: windows
        if: steps.next.outputs.version != ''
        env:
          PLUTOBOOK_RELEASE_VERSION: ${{ steps.next.outputs.version }}
        run: python3 -B .github/scripts/release-assets.py matrix "$PLUTOBOOK_RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PLUTOBOOK_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Build trees, PHP builds and package test images outgrow the runner's free disk.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      # The static renderer stack takes the longest. tools/portable/build checks each part
      # against its inputs, so an older cache only saves the parts that still match.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/sources
            build/portable/root/.local/portable
          key: portable-${{ hashFiles('tools/portable/**', 'tools/patches/**', 'tools/sources.sha256') }}
          restore-keys: portable-
      - run: scripts/build-portable
      - run: scripts/build-packages
      - run: scripts/test-packages
      - run: |
          mkdir -p build/release-assets
          cp build/portable/release/* build/portable/packages/* build/release-assets/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: build/release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-logs
          path: |
            build/portable/root/artifacts/
            build/portable/package-tests/

  renderer:
    name: Build Windows x64 renderer
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: windows-renderer-sources-${{ hashFiles('tools/sources.sha256') }}
      - run: scripts/build-windows-renderer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-renderer
          path: build/windows-renderer/renderer.zip
          if-no-files-found: error

  windows:
    name: Windows PHP ${{ matrix.php }} ${{ matrix.thread }} ${{ matrix.compiler }} x64
    needs: [version, renderer]
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.windows) }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    env:
      PLUTOBOOK_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      PHP_RELEASE: ${{ matrix.php }}
      PHP_THREAD_SAFETY: ${{ matrix.thread }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-renderer
          path: build/windows-renderer
      - name: Set private build directory and renderer path
        run: |
          "PLUTOBOOK_WINDOWS_ROOT=$env:RUNNER_TEMP/plutobook" >> $env:GITHUB_ENV
          "PLUTOBOOK_WINDOWS_RENDERER=$((Resolve-Path build/windows-renderer/renderer.zip).Path)" >> $env:GITHUB_ENV
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plutobook/cache
          key: windows-sources-${{ matrix.php }}-${{ hashFiles('tools/sources.sha256') }}
      - name: Stage checksum-pinned source archives
        run: ./.github/scripts/stage-windows-sources.ps1
      - name: Build and test the native PIE package
        run: python -u scripts/windows/runner.py "$env:PHP_RELEASE" release "$env:PLUTOBOOK_RELEASE_VERSION" "$env:PHP_THREAD_SAFETY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            results/${{ matrix.zip }}
            results/cli.pdf
          if-no-files-found: error

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: php-plutobook-release
      cancel-in-progress: false
    env:
      PLUTOBOOK_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: build/linux-release
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-release-*
          path: build/windows-release
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm poppler-utils
      - name: Check Windows invoices and assemble the exact release assets
        run: python3 -B .github/scripts/release-assets.py collect "$PLUTOBOOK_RELEASE_VERSION"
      - uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts
      - run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
